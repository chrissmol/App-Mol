name: Mol production deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-V2 to publish the current main build
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: public

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY-V2'
    runs-on: ubuntu-latest
    environment: production
    # 15min cancelava o job no meio do test:e2e (4 projetos), com tudo
    # passando -- mesmo ajuste feito no quality gate (ver seu histórico).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # Production audit stays blocking. The full quality workflow separately
      # reports development-only advisories, including braces (no patched release).
      - run: npm run security:scan
      - run: npm audit --omit=dev --audit-level=moderate
      # e2e so em desktop + android: os 4 perfis levavam ~15min no runner.
      # Suite completa (4 perfis): npm run test:e2e.
      - run: npx playwright test --project=desktop --project=android
      - run: npx firebase-tools deploy --only firestore:rules,hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}
