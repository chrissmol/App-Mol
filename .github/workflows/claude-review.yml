name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the diff of this pull request for correctness bugs, security
            issues, and unnecessary complexity. Read the changed files and their
            callers as needed to understand the change, not just the diff lines.
            Post inline comments on the specific lines with real, high-confidence
            findings. If you find nothing worth flagging, do not post a comment.
