name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.agents/**'
      - 'docs/**'

# Um push novo no mesmo PR cancela a execução anterior (economiza minutos do
# plano gratuito do GitHub Actions, que acabou em 2026-10-10).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the diff of this pull request for correctness bugs, security
            issues, and unnecessary complexity. Read the changed files and their
            callers as needed to understand the change, not just the diff lines.
            Post inline comments on the specific lines with real, high-confidence
            findings. If you find nothing worth flagging, do not post a comment.
