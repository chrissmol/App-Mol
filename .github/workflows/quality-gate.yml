name: Mol quality gate

# Sem push na main: o PR já testou o mesmo código, e o deploy roda os testes
# de novo antes de publicar.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.agents/**'
      - 'docs/**'

# Um push novo no mesmo PR cancela a execução anterior (economiza minutos do
# plano gratuito do GitHub Actions, que acabou em 2026-10-10).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: public

jobs:
  quality:
    runs-on: ubuntu-latest
    # Lighthouse + npm audit + semgrep + e2e completo (desktop/android/
    # iphone/tablet) passa de 20min em runners compartilhados quando nada
    # falha cedo (ex.: Lighthouse já não reprova o login em ~2min como
    # antes). 20min cancelava o job no meio dos testes, com tudo passando.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:html
      - run: npm run css:check
      - run: npm run build
      - run: node scripts/performance-audit.mjs
      - name: Run Lighthouse CI on public pages
        shell: bash
        run: |
          npm run preview -- --host 0.0.0.0 > /tmp/mol-preview.log 2>&1 &
          preview_pid=$!
          cleanup_preview() {
            kill "$preview_pid" 2>/dev/null || true
            pkill -TERM -P "$preview_pid" 2>/dev/null || true
            # `npm run preview` gera um processo filho (vite) que sobrevive ao
            # kill acima e prende a porta 4173 para o step de e2e seguinte.
            pkill -f "vite preview" 2>/dev/null || true
          }
          trap cleanup_preview EXIT INT TERM

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:4173/pages/login.html > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/mol-preview.log
            exit 1
          fi

          npx --yes @lhci/cli@0.15.1 autorun \
            --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            public/lighthouse-reports
            public/.lighthouseci
          if-no-files-found: warn
          retention-days: 14
      - run: npm run security:check
      - name: Install Semgrep
        run: python -m pip install semgrep
      - run: npm run security:semgrep
      - run: npm run test:e2e -- --project=desktop --project=android --project=iphone --project=tablet

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: public/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx firebase-tools emulators:exec --project demo-mol --config firebase.json --only firestore "npm run test:rules"

  micro-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: public/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run agents
