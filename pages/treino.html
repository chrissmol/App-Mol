<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PULSE — Treinos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'base-black': '#000000', 'card-dark': '#121212', 'card-dark-2': '#1a1a1a', 'neon': '#00d2ff' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { background-color: #000000; font-family: 'Inter', sans-serif; color: white; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<<body class="bg-base-black pb-28 select-none" id="app-body">

  <div class="max-w-md mx-auto px-5">
    
    <!-- TELA 1: LISTA DE ROTINAS -->
    <div id="view-rotinas" class="block pt-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-extrabold tracking-tight">Treinos</h1>
        <!-- Botão "+" removido para manter a UI mais limpa -->
      </div>

      <div class="flex gap-3 mb-6">
        <button id="btn-nova-rotina" class="flex-1 bg-neon text-black font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
          <i data-lucide="file-plus-2" class="w-4 h-4"></i> Nova Rotina
        </button>
        <button id="btn-explorar" class="flex-1 bg-card-dark border border-white/10 font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
          <i data-lucide="search" class="w-4 h-4 text-neon"></i> Explorar
        </button>
      </div>

      <h2 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider">Minhas Rotinas</h2>
      
      <!-- Container dinâmico das Rotinas -->
      <div id="rotinas-list" class="space-y-4">
        <!-- Rotinas serão injetadas pelo JS aqui -->
      </div>
    </div>

    <!-- TELA 2: DETALHE DO TREINO (Inicia oculta) -->
    <div id="view-detalhe" class="hidden pt-8">
      <div class="flex items-center justify-between mb-6">
        <button id="btn-voltar" class="text-neon p-2 -ml-2 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 id="detalhe-titulo" class="text-xl font-bold tracking-tight">Upper A</h1>
        <button class="text-neon p-2 -mr-2"><i data-lucide="more-horizontal" class="w-6 h-6"></i></button>
      </div>
      <div id="exercicios-list" class="space-y-6"></div>
      <button class="w-full mt-6 bg-card-dark border border-neon/50 text-neon font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
        <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Exercício
      </button>
    </div>

    <!-- TELA 3: NOVA ROTINA (Inicia oculta) -->
    <div id="view-nova-rotina" class="hidden pt-8">
      <div class="flex items-center justify-between mb-6">
        <button id="btn-voltar-nova" class="text-neon p-2 -ml-2 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Criar Rotina</h1>
        <button class="text-neon font-bold text-sm">Salvar</button>
      </div>

      <!-- Campo para digitar o nome da ficha -->
      <input type="text" id="input-nome-rotina" placeholder="Nome do Treino (ex: Upper A)" class="w-full bg-transparent border-b border-white/20 text-2xl font-bold py-2 outline-none focus:border-neon mb-6 placeholder-gray-700 transition-colors">

      <!-- Aqui no futuro entrará a lista de exercícios que a pessoa escolher -->
      
      <button class="w-full bg-card-dark border border-neon/50 text-neon font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
        <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Exercício
      </button>
    </div>

    <!-- TELA 4: EXPLORAR (Inicia oculta) -->
    <div id="view-explorar" class="hidden pt-8">
      <div class="flex items-center justify-start mb-6">
        <button id="btn-voltar-explorar" class="text-neon p-2 -ml-2 mr-2 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Explorar Treinos</h1>
      </div>
      <div class="text-center text-gray-500 mt-16">
        <i data-lucide="compass" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
        <p class="font-medium">Aba Explorar.</p>
        <p class="text-sm mt-2">Em breve você poderá buscar treinos da comunidade ou modelos prontos por aqui.</p>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV (Mantida igualzinho) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-dark/90 backdrop-blur-lg border-t border-white/10 z-50">
    <div class="max-w-md mx-auto px-8 py-3 flex items-center justify-between">
      <a href="../index.html" class="flex flex-col items-center gap-1 text-gray-500 transition-fluid hover:text-neon"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] font-medium">Início</span></a>
      <a href="#" class="flex flex-col items-center gap-1 text-neon transition-fluid"><i data-lucide="dumbbell" class="w-5 h-5"></i><span class="text-[10px] font-semibold">Treino</span></a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-500 transition-fluid hover:text-neon"><i data-lucide="apple" class="w-5 h-5"></i><span class="text-[10px] font-medium">Dieta</span></a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-500 transition-fluid hover:text-neon"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-medium">Perfil</span></a>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/pages/treino.js"></script>
</body>
</body>
</html>
