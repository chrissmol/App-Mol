<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Mol</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'base-black': '#000000',
            'card-dark': '#121212',
            'neon': '#1E7349', /* Verde Esmeralda Atualizado */
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          boxShadow: { 'glow-sm': '0 0 12px 0 rgba(30, 115, 73, 0.35)' }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body { background-color: #000000; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { display: none; }
    .text-glow { text-shadow: 0 0 16px rgba(30, 115, 73, 0.55); }
    .transition-fluid { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>

<body class="bg-base-black text-white min-h-screen pb-28 select-none opacity-0 transition-opacity duration-500" id="app-body">
  <div class="max-w-md mx-auto px-5">
    <header class="flex items-center justify-between pt-8 pb-6">
      <div>
        <p class="text-sm text-gray-500 font-medium">Resumo de Hoje</p>
        <h1 class="text-2xl font-extrabold tracking-tight mt-0.5">
          Olá, <span id="user-name" style="color: #1E7349;">Carregando...</span> 👋
        </h1>
      </div>

      <button id="btn-profile" class="relative w-12 h-12 rounded-full bg-card-dark border border-white/10 flex items-center justify-center transition-fluid active:scale-95 overflow-hidden">
        <i id="default-avatar-icon" data-lucide="user" class="w-5 h-5 text-neon"></i>
        <img id="user-avatar" src="" alt="Perfil" class="w-full h-full object-cover hidden">
      </button>
    </header>

    <section class="bg-card-dark rounded-2xl p-5 border border-white/5 mb-4">
      <div class="flex items-center justify-between">
        <div class="flex-1">
          <h2 class="font-bold text-base mb-1">Calorias</h2>
          <p id="cal-meta" class="text-xs text-gray-500 mb-4">Meta diária: ...</p>
        </div>

        <div class="relative w-24 h-24 shrink-0">
          <svg class="w-24 h-24 -rotate-90">
            <circle cx="48" cy="48" r="40" stroke="#1f1f1f" stroke-width="8" fill="none" />
            <circle id="calorieRing" cx="48" cy="48" r="40" stroke="#1E7349" stroke-width="8" fill="none" stroke-linecap="round" style="stroke-dasharray: 251.2; stroke-dashoffset: 251.2; transition: stroke-dashoffset 1s ease-in-out;" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-lg font-extrabold">0%</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-card-dark/95 backdrop-blur-lg border-t border-white/10 z-50">
    <div class="max-w-md mx-auto px-8 py-3 flex items-center justify-between">
      
      <!-- Aba Início (Ativa -> Verde) -->
      <a href="#" class="flex flex-col items-center gap-1 text-[#1E7349] transition-fluid">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Início</span>
      </a>
      
      <!-- Aba Treino (Inativa -> Cinza que vira verde no hover) -->
      <a href="./pages/treino.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#1E7349] transition-fluid">
        <i data-lucide="dumbbell" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Treino</span>
      </a>
      
      <!-- Aba Dieta (Inativa -> Cinza que vira verde no hover) -->
      <a href="#" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#1E7349] transition-fluid">
        <i data-lucide="apple" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Dieta</span>
      </a>
      
      <!-- Aba Perfil (Inativa -> Cinza que vira verde no hover) -->
      <a href="#" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#1E7349] transition-fluid">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Perfil</span>
      </a>

    </div>
  </nav>

  <script>lucide.createIcons();</script>
  <script type="module" src="./js/pages/dashboard.js"></script>
</body>
</html>
