<body id="app-body" class="app-surface min-h-screen pb-28 text-white opacity-0 transition-opacity duration-500">
  <main class="mx-auto max-w-md px-5">

    <section class="glass-card mb-4 rounded-3xl p-5 animate-slide-up"><div class="flex items-center justify-between"><div><p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Esta semana</p><h2 id="weekly-title" class="mt-1 text-lg font-extrabold">0 treinos concluídos</h2></div><a href="./pages/historico.html" class="text-xs font-bold text-neon">Histórico</a></div><div class="mt-5 grid grid-cols-7 gap-2" id="week-days"></div><div class="mt-5 grid grid-cols-3 gap-2 border-t border-white/5 pt-4 text-center"><div><p id="weekly-sessions" class="text-lg font-extrabold">0</p><p class="text-[10px] font-semibold uppercase text-gray-500">sessões</p></div><div class="border-x border-white/10"><p id="weekly-volume" class="text-lg font-extrabold text-neon">0</p><p class="text-[10px] font-semibold uppercase text-gray-500">kg volume</p></div><div><p id="weekly-streak" class="text-lg font-extrabold">0</p><p class="text-[10px] font-semibold uppercase text-gray-500">semanas</p></div></div></section>
    <section class="mb-4"><a href="./pages/progresso.html" class="glass-card block rounded-2xl p-4"><i data-lucide="chart-no-axes-combined" class="h-5 w-5 text-neon"></i><h2 class="mt-4 font-bold">Progresso</h2><p id="performance-summary" class="mt-1 text-xs leading-relaxed text-gray-500">Seu desempenho aparecerá aqui.</p></a></section>
