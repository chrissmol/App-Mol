<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Mol — Treinos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { 
          'base-black': '#000000', 
          'card-dark': '#121212', 
          'card-dark-2': '#1a1a1a', 
          'neon': '#1E7349'  /* Verde Esmeralda Principal */
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { background-color: #000000; font-family: 'Inter', sans-serif; color: white; }
    ::-webkit-scrollbar { display: none; }
    
    /* Remove as setinhas dos inputs de número */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-base-black pb-28 select-none" id="app-body">

  <div class="max-w-md mx-auto px-5">
    
    <div id="view-rotinas" class="block pt-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-extrabold tracking-tight">Treinos</h1>
      </div>
      <div class="flex gap-3 mb-6">
        <!-- Botão Principal: Verde Sólido -->
        <button id="btn-nova-rotina" class="flex-1 bg-[#1E7349] hover:bg-[#278a59] text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
          <i data-lucide="file-plus-2" class="w-4 h-4"></i> Nova Rotina
        </button>
        <!-- Botão Secundário: Escuro com borda padrão -->
        <button id="btn-explorar" class="flex-1 bg-card-dark border border-white/10 hover:border-[#1E7349] font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
          <i data-lucide="search" class="w-4 h-4 text-gray-400"></i> Explorar
        </button>
      </div>
      <h2 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider">Minhas Rotinas</h2>
      <div id="rotinas-list" class="space-y-4"></div>
    </div>

    <!-- TELA 2: DETALHE DO TREINO -->
    <div id="view-detalhe" class="hidden pt-8">
      <div class="flex items-center justify-between mb-6">
        <button id="btn-voltar" class="text-gray-400 hover:text-[#1E7349] p-2 -ml-2 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 id="detalhe-titulo" class="text-xl font-bold tracking-tight">Nome do Treino</h1>
        
        <!-- Botão Concluir -->
        <button id="btn-concluir-treino" onclick="finalizarEConcluirTreino()" class="px-4 py-2 rounded-xl text-xs font-bold border border-[#1E7349]/50 text-[#1E7349] hover:bg-[#1E7349] hover:text-white transition-all active:scale-95">
          Concluir
        </button>
      </div>
      
      <div id="exercicios-list" class="space-y-6"></div>
      
      <button id="btn-add-exercicio" class="w-full mt-6 bg-card-dark border border-[#1E7349]/50 text-[#1E7349] hover:bg-[#1E7349] hover:text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
        <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Exercício
      </button>
    </div>

    <div id="view-nova-rotina" class="hidden pt-8">
      <div class="flex items-center justify-between mb-6">
        <button id="btn-voltar-nova" class="text-gray-400 hover:text-[#1E7349] p-2 -ml-2 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Criar Rotina</h1>
        <button id="btn-salvar-nova" class="text-[#1E7349] font-bold text-sm">Salvar</button>
      </div>
      <input type="text" id="input-nome-rotina" placeholder="Nome do Treino (ex: Upper A)" class="w-full bg-transparent border-b border-white/20 text-2xl font-bold py-2 outline-none focus:border-[#1E7349] mb-6 placeholder-gray-700 transition-colors">
    </div>

    <div id="view-explorar" class="hidden pt-8">
      <div class="flex items-center justify-start mb-6">
        <button id="btn-voltar-explorar" class="text-gray-400 hover:text-[#1E7349] p-2 -ml-2 mr-2 active:scale-95 transition-all">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Explorar Treinos</h1>
      </div>
      <div class="text-center text-gray-500 mt-16">
        <i data-lucide="compass" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
        <p class="font-medium">Em breve!</p>
      </div>
    </div>

    <div id="view-biblioteca" class="hidden pt-8">
      <div class="flex items-center justify-between mb-6">
        <button id="btn-voltar-biblioteca" class="text-gray-400 hover:text-[#1E7349] p-2 -ml-2 active:scale-95 transition-all">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Exercícios</h1>
        <div class="w-10"></div>
      </div>
      
      <div class="bg-card-dark flex items-center px-4 py-3 rounded-xl mb-6 border border-white/10 focus-within:border-[#1E7349] transition-colors">
        <i data-lucide="search" class="w-5 h-5 text-gray-500 mr-3"></i>
        <input type="text" id="input-busca-exercicio" placeholder="Buscar exercício..." class="bg-transparent w-full text-sm outline-none">
      </div>

      <div id="biblioteca-list" class="space-y-2"></div>
    </div>

  </div>

  <div id="modal-tipo-serie" class="fixed inset-0 bg-black/60 z-[100] hidden flex-col justify-end transition-opacity opacity-0">
      <div id="modal-tipo-serie-content" class="bg-card-dark rounded-t-3xl p-6 transform translate-y-full transition-transform duration-300">
        <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-6"></div>
        <h3 class="text-center font-bold mb-6 text-lg tracking-tight">Selecionar Tipo de Série</h3>
        
        <div class="space-y-2">
          <button onclick="mudarTipoSerie('W')" class="w-full flex items-center p-4 rounded-2xl active:bg-white/5 transition-colors">
            <span class="text-orange-400 font-extrabold w-10 text-lg">W</span> 
            <span class="font-medium text-white text-base">Série de Aquecimento</span>
          </button>
          
          <button onclick="mudarTipoSerie('N')" class="w-full flex items-center p-4 rounded-2xl active:bg-white/5 transition-colors">
            <span class="text-white font-extrabold w-10 text-lg">1</span> 
            <span class="font-medium text-white text-base">Série Normal</span>
          </button>
          
          <button onclick="mudarTipoSerie('F')" class="w-full flex items-center p-4 rounded-2xl active:bg-white/5 transition-colors">
            <span class="text-red-400 font-extrabold w-10 text-lg">F</span> 
            <span class="font-medium text-white text-base">Série Falhada</span>
          </button>
          
          <button onclick="mudarTipoSerie('D')" class="w-full flex items-center p-4 rounded-2xl active:bg-white/5 transition-colors">
            <span class="text-blue-400 font-extrabold w-10 text-lg">D</span> 
            <span class="font-medium text-white text-base">Série Drop</span>
          </button>
          
          <div class="h-px bg-white/10 my-2"></div>
          
          <button onclick="removerSerieAberta()" class="w-full flex items-center p-4 rounded-2xl active:bg-white/5 transition-colors text-red-500">
            <i data-lucide="x" class="w-5 h-5 mr-5"></i> 
            <span class="font-medium text-base">Remover Série</span>
          </button>
        </div>
      </div>
  </div>

  <!-- Barra de Navegação Inferior: Cinza padrão que acende para verde no hover/seleção -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-dark/95 backdrop-blur-lg border-t border-white/10 z-50">
    <div class="max-w-md mx-auto px-8 py-3 flex items-center justify-between">
      <a href="../index.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#1E7349] transition-fluid">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Início</span>
      </a>
      
      <!-- Treino ativo nesta página (Fica verde) -->
      <a href="#" class="flex flex-col items-center gap-1 text-[#1E7349] transition-fluid">
        <i data-lucide="dumbbell" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Treino</span>
      </a>
      
      <a href="#" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#1E7349] transition-fluid">
        <i data-lucide="apple" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Dieta</span>
      </a>
      
      <a href="#" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#1E7349] transition-fluid">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Perfil</span>
      </a>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/pages/treino.js?v=7"></script>
</body>
</html>
