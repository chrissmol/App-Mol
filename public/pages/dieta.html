<!DOCTYPE html><html lang="pt-BR" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="google" content="notranslate"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no,date=no,address=no,email=no"><meta name="theme-color" content="#070a08"><title>Mol</title><script type="importmap">{"imports":{"firebase/app":"../vendor/firebase.js","firebase/auth":"../vendor/firebase.js","firebase/firestore":"../vendor/firebase.js","lucide":"../vendor/lucide.js"}}</script><script src="/theme-bootstrap.js"></script><link rel="icon" type="image/svg+xml" href="../assets/mol-mark.svg"><link rel="stylesheet" href="../css/tailwind.css"><link rel="stylesheet" href="../css/style.css"></head>
<body class="app-surface min-h-screen pb-28 text-white" aria-busy="true"><main class="mx-auto max-w-md px-5 pt-6">
  <header><a class="mol-brand" href="../index.html" aria-label="Ir para o início"><img src="../assets/mol-mark.svg" alt="">Mol</a><div class="mt-4 flex items-end justify-between gap-4"><div><p class="text-xs font-semibold uppercase tracking-[.16em] text-neon">Nutrição diária</p><h1 class="mt-1 text-2xl font-extrabold">Dieta</h1><p class="mt-2 text-sm text-gray-500">Planeje refeições e acompanhe seus nutrientes.</p></div><button id="add-meal" type="button" disabled class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-neon text-black" aria-label="Adicionar refeição"><i data-lucide="plus" class="h-5 w-5"></i></button></div></header>
  <div id="diet-status" class="glass-card mt-6 rounded-2xl p-4 text-sm text-gray-500" role="status">Carregando sua dieta…</div>
  <div id="diet-content" class="hidden">
    <section id="fasting-card" class="glass-card mt-6 rounded-3xl p-5"></section>
    <section id="next-meal" class="glass-card mt-4 rounded-3xl p-5"></section>
    <section class="glass-card mt-4 rounded-3xl p-5"><div class="flex items-start justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-wider text-gray-400">Planejado hoje</p><h2 id="diet-total" class="mt-1 text-2xl font-extrabold">0 kcal</h2><p id="calorie-goal" class="mt-1 text-xs text-gray-500">Meta: 2.400 kcal</p></div><button id="food-search" type="button" class="min-h-10 rounded-xl bg-white/5 px-3 text-xs font-bold text-gray-300">Buscar alimento</button></div><div class="mt-4 h-2 overflow-hidden rounded-full bg-white/10"><div id="calorie-progress" class="h-full rounded-full bg-neon"></div></div><div id="macro-total" class="mt-4 grid grid-cols-3 gap-2 text-center"></div></section>
    <div class="mt-7 flex items-end justify-between"><div><p class="text-xs font-semibold uppercase tracking-wider text-neon">Agenda</p><h2 class="mt-1 text-lg font-extrabold">Suas refeições</h2></div><span id="meal-count" class="text-xs text-gray-500"></span></div>
    <div id="meal-list" class="mt-4 space-y-3"></div>
    <p class="mt-6 text-center text-xs leading-relaxed text-gray-500">Valores são estimativas. Confira rótulos e siga a orientação do seu nutricionista.</p>
  </div>
</main><nav class="fixed bottom-0 left-0 right-0 border-t border-white/10"></nav><div id="diet-modal"></div><script type="module" src="../js/pages/dieta.js"></script></body></html>
