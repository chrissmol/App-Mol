<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate app-static-root">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="theme-color" content="#070a08">
<title>Mol</title>
<script type="importmap">{"imports":{"firebase/app":"../vendor/firebase.js","firebase/auth":"../vendor/firebase.js","firebase/firestore":"../vendor/firebase.js","lucide":"../vendor/lucide.js"}}</script>
<script src="/theme-bootstrap.js"></script>
<link rel="icon" type="image/svg+xml" href="../assets/mol-mark.svg">

<!-- CSS compilado localmente no build -->
<link rel="stylesheet" href="../css/tailwind.css">

<!-- Estilos globais compartilhados -->
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="app-static-page login-page bg-base-black text-white">

  <!-- Glow radial de fundo, dá profundidade sem sair do preto absoluto -->
  <div class="fixed inset-0 bg-radial-glow pointer-events-none"></div>

  <div class="login-shell relative max-w-md mx-auto flex flex-col justify-between px-6 py-10">

    <!-- ================= LOGO / MARCA ================= -->
    <div class="flex-1 flex flex-col items-center justify-center text-center">

      <!-- Ícone da marca: pulso/batimento dentro de um anel com o verde novo -->
      <div class="w-20 h-20 rounded-2xl mol-panel border border-neon/40 flex items-center justify-center mb-6">
        <svg class="w-9 h-9 text-neon" viewBox="0 0 64 64" role="img" aria-label="Mol"><path d="M13 34h9l5-15 10 29 6-14h8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/></svg>
      </div>

      <h1 class="text-4xl font-black tracking-tight">Mol</h1>
      <p class="text-sm text-gray-400 font-medium mt-2 max-w-[260px]">
        Treino, dieta e evolução em um só lugar.
      </p>
    </div>

    <!-- ================= AÇÕES DE LOGIN ================= -->
    <div class="w-full space-y-4 pb-2">

      <!-- Mensagem de erro (escondida por padrão, controlada via JS) -->
      <p id="loginError" role="alert" aria-live="assertive" class="hidden items-center justify-center gap-2 text-xs font-medium text-center"><svg id="loginMessageIcon" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg><span id="loginMessageText"></span></p>

      <div class="glass-card rounded-3xl border border-neon/15 p-5">

        <!-- Botão principal: Entrar com Google -->
        <button
          type="button"
          id="googleLoginBtn"
          class="w-full min-h-[52px] bg-white text-black font-bold text-sm rounded-2xl border border-black/15 flex items-center justify-center gap-3 transition-fluid active:scale-[0.98]"
        >
          <!-- Logo oficial do Google em SVG (multi-cor) -->
          <svg class="w-5 h-5" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-4.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 45c5.5 0 10.5-2.1 14.3-5.5l-6.6-5.6C29.6 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.6C40.9 36 44 30.6 44 24c0-1.4-.1-2.8-.4-3.5z"/>
          </svg>
          Continuar com Google
        </button>

        <!-- Divisor -->
        <div class="flex items-center gap-3 py-4">
          <span class="flex-1 h-px bg-white/10"></span>
          <span class="text-xs text-gray-400 font-medium">Ou com e-mail</span>
          <span class="flex-1 h-px bg-white/10"></span>
        </div>

        <!-- Login/cadastro com e-mail e senha -->
        <form id="emailAuthForm" class="space-y-3" novalidate>
          <div id="authNameField" class="relative hidden">
            <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <label for="authName" class="sr-only">Nome</label>
            <input id="authName" name="name" type="text" autocomplete="name" placeholder="Nome" class="w-full min-h-12 rounded-2xl mol-field pl-11 pr-4 text-sm text-white placeholder:text-gray-500">
          </div>
          <div class="relative">
            <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <label for="authEmail" class="sr-only">E-mail</label>
            <input id="authEmail" name="email" type="email" autocomplete="email" required placeholder="E-mail" class="w-full min-h-12 rounded-2xl mol-field pl-11 pr-4 text-sm text-white placeholder:text-gray-500">
          </div>
          <div class="relative">
            <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <label for="authPassword" class="sr-only">Senha</label>
            <input id="authPassword" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Senha" class="w-full min-h-12 rounded-2xl mol-field pl-11 pr-12 text-sm text-white placeholder:text-gray-500">
            <button type="button" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false" class="absolute right-0 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center text-gray-400">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="togglePasswordIcon" d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <button type="submit" id="emailAuthSubmit" class="w-full min-h-[52px] rounded-2xl bg-neon text-sm font-bold text-black transition-fluid active:scale-[0.98]">Entrar</button>
          <button type="button" id="emailLinkBtn" class="w-full min-h-11 text-xs text-gray-400 underline underline-offset-2">Entrar com link por e-mail, sem senha</button>
          <div class="flex items-center justify-between text-xs">
            <button type="button" id="toggleAuthMode" class="text-gray-400 underline underline-offset-2">Criar conta</button>
            <button type="button" id="forgotPassword" class="text-gray-400 underline underline-offset-2">Esqueci a senha</button>
          </div>
        </form>
      </div>

      <!-- Termos atualizados para Mol -->
      <p class="text-xs text-gray-400 text-center leading-relaxed px-4">
        Ao continuar, você concorda com os
        <button type="button" data-legal="terms" class="text-neon underline underline-offset-2">Termos de Uso</button>
        e a
        <button type="button" data-legal="privacy" class="text-neon underline underline-offset-2">Política de Privacidade</button>
        do Mol.
      </p>
    </div>
  </div>

  <!-- ============================================================
      JAVASCRIPT (ES6 Modules)
      ============================================================ -->
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
