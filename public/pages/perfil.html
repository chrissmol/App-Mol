<!DOCTYPE html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Mol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/config/tailwind.config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-surface pb-28 text-white" id="app-body">

  <div class="max-w-md mx-auto px-5 pt-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-extrabold tracking-tight">Meu Perfil</h1>
    </div>

    <div class="glass-card rounded-3xl p-6 border border-white/5 flex flex-col items-center text-center mb-6">
      <div class="relative w-20 h-20 rounded-full bg-card-dark-2 border border-white/10 flex items-center justify-center overflow-hidden mb-4 shadow-md">
        <i id="default-avatar-icon" data-lucide="user" class="w-8 h-8 text-neon"></i>
        <img id="user-avatar" src="" alt="Perfil" class="w-full h-full object-cover hidden">
      </div>
      <h2 id="user-name" class="font-bold text-lg mb-1">Carregando...</h2>
      <p id="user-email" class="text-xs text-gray-500">...</p>
    </div>

    <div class="glass-card rounded-3xl p-5 border border-white/5 mb-6 space-y-4">
      <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Configurações de Meta</h3>
      
      <div>
        <label class="block text-xs text-gray-400 mb-1">Meta Diária de Calorias (kcal)</label>
        <input type="number" id="input-meta-cal" value="2400" class="w-full bg-card-dark-2 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-neon outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3"><label class="text-xs text-gray-400">Altura (cm)<input type="number" id="input-altura" placeholder="Ex.: 175" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"></label><label class="text-xs text-gray-400">Meta de peso (kg)<input type="number" step="0.1" id="input-meta-peso" placeholder="Opcional" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"></label></div>
      <label class="block text-xs text-gray-400">Objetivo<select id="input-objetivo" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"><option value="">Selecione</option><option value="Hipertrofia">Hipertrofia</option><option value="Emagrecimento">Emagrecimento</option><option value="Força">Força</option><option value="Condicionamento">Condicionamento</option><option value="Manutenção">Manutenção</option></select></label>
      <label class="block text-xs text-gray-400">Meta semanal de treinos<select id="input-meta-semanal" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"><option value="2">2 treinos</option><option value="3">3 treinos</option><option value="4">4 treinos</option><option value="5">5 treinos</option><option value="6">6 treinos</option></select></label>

      <button id="btn-salvar-meta" class="w-full bg-neon text-black font-bold py-3 rounded-xl text-sm active:scale-95 transition-all">
        Salvar Alterações
      </button>
    </div>

    <div class="glass-card rounded-3xl p-5 border border-white/5 mb-6"><div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Evolução corporal</h3><p id="peso-atual" class="mt-2 text-2xl font-extrabold">— kg</p></div><i data-lucide="scale" class="h-5 w-5 text-neon"></i></div><div class="mt-4 flex gap-2"><input id="input-peso" type="number" step="0.1" placeholder="Peso atual (kg)" class="min-w-0 flex-1 rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"><button id="btn-registrar-peso" class="min-h-12 rounded-xl bg-neon px-4 text-sm font-bold text-black">Registrar</button></div><p id="peso-tendencia" class="mt-3 text-xs text-gray-500">Registre seu peso para acompanhar a tendência.</p></div>

    <div class="glass-card rounded-3xl p-5 border border-white/5 mb-6 space-y-4"><h3 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Preferências de treino</h3><div class="grid grid-cols-2 gap-3"><label class="text-xs text-gray-400">Nível<select id="input-nivel" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"><option value="">Selecione</option><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select></label><label class="text-xs text-gray-400">Duração preferida<select id="input-duracao" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"><option value="45">45 min</option><option value="60">60 min</option><option value="75">75 min</option><option value="90">90 min</option></select></label></div><label class="block text-xs text-gray-400">Descanso padrão (segundos)<input id="input-descanso" type="number" value="90" class="mt-1 w-full rounded-xl border border-white/10 bg-card-dark-2 px-3 py-3 text-white"></label><p class="text-xs text-gray-500">Dias preferidos para treinar</p><div id="perfil-dias" class="grid grid-cols-7 gap-1"><label><input class="peer sr-only" type="checkbox" value="1"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">S</span></label><label><input class="peer sr-only" type="checkbox" value="2"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">T</span></label><label><input class="peer sr-only" type="checkbox" value="3"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">Q</span></label><label><input class="peer sr-only" type="checkbox" value="4"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">Q</span></label><label><input class="peer sr-only" type="checkbox" value="5"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">S</span></label><label><input class="peer sr-only" type="checkbox" value="6"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">S</span></label><label><input class="peer sr-only" type="checkbox" value="0"><span class="flex h-10 items-center justify-center rounded-xl bg-white/5 text-xs font-bold peer-checked:bg-neon peer-checked:text-black">D</span></label></div></div>

    <div class="glass-card rounded-3xl p-5 border border-white/5 mb-6"><h3 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Medidas corporais <span class="font-normal normal-case">(opcional)</span></h3><div class="mt-4 grid grid-cols-3 gap-2"><label class="text-[10px] text-gray-500">CINTURA<input id="medida-cintura" type="number" step="0.1" class="mt-1 w-full rounded-xl bg-card-dark-2 p-3 text-center text-white"></label><label class="text-[10px] text-gray-500">PEITO<input id="medida-peito" type="number" step="0.1" class="mt-1 w-full rounded-xl bg-card-dark-2 p-3 text-center text-white"></label><label class="text-[10px] text-gray-500">BRAÇO<input id="medida-braco" type="number" step="0.1" class="mt-1 w-full rounded-xl bg-card-dark-2 p-3 text-center text-white"></label></div><p class="mt-3 text-xs text-gray-500">Em centímetros. Salvas de forma privada no seu perfil.</p></div>

    <button id="btn-logout" class="w-full bg-card-dark border border-red-500/30 text-red-400 font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
      <i data-lucide="log-out" class="w-4 h-4"></i> Sair da Conta
    </button>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-card-dark/90 backdrop-blur-lg border-t border-white/10 z-50">
    <div class="max-w-md mx-auto px-8 py-3 flex items-center justify-between">
      <a href="../index.html" class="flex flex-col items-center gap-1 text-gray-500 transition-fluid hover:text-neon">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Início</span>
      </a>
      <a href="./treino.html" class="flex flex-col items-center gap-1 text-gray-500 transition-fluid hover:text-neon">
        <i data-lucide="dumbbell" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Treino</span>
      </a>
      <button type="button" data-coming-soon="Dieta" class="flex flex-col items-center gap-1 text-gray-500 transition-fluid hover:text-neon">
        <i data-lucide="apple" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Dieta</span>
      </button>
      <a href="#" class="flex flex-col items-center gap-1 text-neon transition-fluid">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Perfil</span>
      </a>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
  <script type="module" src="../js/pages/perfil.js"></script>
</body>
</html>
